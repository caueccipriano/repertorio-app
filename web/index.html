<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Repertório — sua biblioteca pessoal de conhecimento."
  >
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#F5F2EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Repertório">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/Icon.svg">
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F5F2EA;
      overscroll-behavior: none;
    }

    /* iOS PWA: paint the notch / Dynamic Island safe area as part of the app. */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-top);
      background: #10265E;
      z-index: 2147483647;
      pointer-events: none;
    }
  </style>

  <title>Repertório</title>
</head>
<body>
  <script>
    window.repertorioSpeech = {
      generation: 0,
      supported: function () {
        return 'speechSynthesis' in window &&
          'SpeechSynthesisUtterance' in window;
      },
      speak: function (text, rate) {
        return new Promise(function (resolve) {
          if (!window.repertorioSpeech.supported()) {
            resolve(false);
            return;
          }

          const synth = window.speechSynthesis;
          const generation = ++window.repertorioSpeech.generation;
          const cleanText = String(text || '').replace(/\s+/g, ' ').trim();

          if (!cleanText) {
            resolve(false);
            return;
          }

          const sentences = cleanText.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [cleanText];
          const chunks = [];
          let current = '';

          sentences.forEach(function (sentence) {
            const next = (current + ' ' + sentence).trim();
            if (next.length > 220 && current) {
              chunks.push(current);
              current = sentence.trim();
            } else {
              current = next;
            }
          });
          if (current) chunks.push(current);

          const chooseVoice = function () {
            const voices = synth.getVoices ? synth.getVoices() : [];
            return voices.find(v => /^pt-BR$/i.test(v.lang)) ||
              voices.find(v => /^pt/i.test(v.lang)) ||
              null;
          };

          let index = 0;
          let started = false;
          let resolved = false;

          const finishStartup = function (value) {
            if (!resolved) {
              resolved = true;
              resolve(value);
            }
          };

          const speakNext = function () {
            if (generation !== window.repertorioSpeech.generation) return;
            if (index >= chunks.length) return;

            const utterance = new SpeechSynthesisUtterance(chunks[index++]);
            utterance.lang = 'pt-BR';
            utterance.rate = Math.max(0.7, Math.min(1.5, rate || 1.0));
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            const voice = chooseVoice();
            if (voice) utterance.voice = voice;

            utterance.onstart = function () {
              started = true;
              finishStartup(true);
            };
            utterance.onend = function () {
              if (generation === window.repertorioSpeech.generation) {
                speakNext();
              }
            };
            utterance.onerror = function () {
              if (!started) finishStartup(false);
            };

            synth.speak(utterance);
            if (synth.paused) synth.resume();
          };

          if (synth.speaking || synth.pending || synth.paused) {
            synth.cancel();
          }

          if (synth.getVoices) synth.getVoices();
          speakNext();

          window.setTimeout(function () {
            if (!resolved) {
              finishStartup(
                generation === window.repertorioSpeech.generation &&
                  (synth.speaking || synth.pending)
              );
            }
          }, 900);
        });
      },
      stop: function () {
        if ('speechSynthesis' in window) {
          window.repertorioSpeech.generation++;
          window.speechSynthesis.cancel();
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
        }
      }
    };

    if ('speechSynthesis' in window && window.speechSynthesis.getVoices) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener?.('voiceschanged', function () {
        window.speechSynthesis.getVoices();
      });
    }

    window.repertorioSpotify = {
      open: async function (url) {
        try {
          const parsed = new URL(url);
          const parts = parsed.pathname.split('/').filter(Boolean);
          const episodeIndex = parts.indexOf('episode');

          if (episodeIndex < 0 || !parts[episodeIndex + 1]) {
            return false;
          }

          const episodeId = parts[episodeIndex + 1];

          const previous = document.getElementById('repertorio-spotify-overlay');
          if (previous) previous.remove();

          const overlay = document.createElement('div');
          overlay.id = 'repertorio-spotify-overlay';
          overlay.setAttribute('role', 'dialog');
          overlay.setAttribute('aria-modal', 'true');
          overlay.setAttribute('aria-label', 'Player do Spotify');
          overlay.style.position = 'fixed';
          overlay.style.top = 'calc(env(safe-area-inset-top) + 76px)';
          overlay.style.left = '12px';
          overlay.style.right = '12px';
          overlay.style.zIndex = '2147483646';
          overlay.style.pointerEvents = 'none';
          overlay.style.display = 'flex';
          overlay.style.justifyContent = 'center';

          const shell = document.createElement('div');
          shell.style.width = 'min(100%, 420px)';
          shell.style.margin = '0 auto';
          shell.style.background = '#121212';
          shell.style.border = '1px solid rgba(255,255,255,.18)';
          shell.style.borderRadius = '16px';
          shell.style.overflow = 'hidden';
          shell.style.boxShadow = '0 12px 36px rgba(0,0,0,.34)';
          shell.style.pointerEvents = 'auto';

          const header = document.createElement('div');
          header.style.height = '42px';
          header.style.display = 'flex';
          header.style.alignItems = 'center';
          header.style.padding = '0 8px 0 14px';
          header.style.background = '#10265E';
          header.style.color = '#fff';
          header.style.fontFamily = 'Arial, sans-serif';

          const title = document.createElement('div');
          title.textContent = 'Spotify · ouvir aqui';
          title.style.fontSize = '13px';
          title.style.fontWeight = '700';
          title.style.letterSpacing = '.02em';
          title.style.flex = '1';

          const close = document.createElement('button');
          close.type = 'button';
          close.setAttribute('aria-label', 'Fechar player');
          close.textContent = '×';
          close.style.border = '0';
          close.style.background = 'transparent';
          close.style.color = '#fff';
          close.style.fontSize = '26px';
          close.style.lineHeight = '1';
          close.style.width = '38px';
          close.style.height = '38px';
          close.style.cursor = 'pointer';

          const iframe = document.createElement('iframe');
          iframe.title = 'Spotify Embed';
          iframe.src =
            'https://open.spotify.com/embed/episode/' +
            encodeURIComponent(episodeId) +
            '?utm_source=repertorio';
          iframe.width = '100%';
          iframe.height = '152';
          iframe.frameBorder = '0';
          iframe.allowFullscreen = true;
          iframe.allow =
            'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
          iframe.loading = 'eager';
          iframe.style.display = 'block';
          iframe.style.background = '#121212';

          header.appendChild(title);
          header.appendChild(close);
          shell.appendChild(header);
          shell.appendChild(iframe);
          overlay.appendChild(shell);

          const dismiss = function () {
            overlay.remove();
          };

          close.addEventListener('click', dismiss);
          document.body.appendChild(overlay);
          close.focus();

          return true;
        } catch (_) {
          return false;
        }
      }
    };

    window.repertorioOffline = {
      supported: function () {
        return 'caches' in window;
      },
      cacheUrl: async function (url) {
        try {
          const cache = await caches.open('repertorio-media-v1');
          const response = await fetch(url, { mode: 'no-cors' });
          await cache.put(url, response.clone());
          return true;
        } catch (_) {
          return false;
        }
      },
      removeUrl: async function (url) {
        try {
          const cache = await caches.open('repertorio-media-v1');
          return await cache.delete(url);
        } catch (_) {
          return false;
        }
      }
    };

    window.repertorioShareCard = {
      supported: function () {
        return 'HTMLCanvasElement' in window;
      },
      share: async function (title, body) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1350;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#F5F2EA';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#173B91';
          ctx.beginPath();
          ctx.arc(170, 190, 90, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#101010';
          ctx.fillRect(300, 90, 46, 260);

          ctx.font = '700 38px Arial';
          ctx.fillStyle = '#173B91';
          ctx.fillText('repertório*', 90, 460);

          function wrapText(text, x, y, maxWidth, lineHeight, maxLines) {
            const words = text.split(/\s+/);
            let line = '';
            let lines = 0;
            for (let n = 0; n < words.length; n++) {
              const testLine = line + words[n] + ' ';
              const metrics = ctx.measureText(testLine);
              if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line.trim(), x, y);
                line = words[n] + ' ';
                y += lineHeight;
                lines++;
                if (lines >= maxLines - 1) break;
              } else {
                line = testLine;
              }
            }
            if (lines < maxLines) ctx.fillText(line.trim(), x, y);
            return y;
          }

          ctx.fillStyle = '#101010';
          ctx.font = '700 68px Georgia';
          const titleEnd = wrapText(title, 90, 570, 900, 78, 4);

          ctx.fillStyle = '#575752';
          ctx.font = '400 34px Arial';
          wrapText(body, 90, titleEnd + 90, 900, 52, 8);

          ctx.fillStyle = '#173B91';
          ctx.font = '700 24px Arial';
          ctx.fillText('aprendi hoje no Repertório', 90, 1260);

          const blob = await new Promise(resolve =>
            canvas.toBlob(resolve, 'image/png')
          );
          if (!blob) return false;

          const file = new File([blob], 'repertorio-card.png', {
            type: 'image/png'
          });

          if (navigator.share && navigator.canShare &&
              navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Repertório',
              text: title
            });
            return true;
          }

          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = 'repertorio-card.png';
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          return true;
        } catch (_) {
          return false;
        }
      }
    };

    window.repertorioUpdates = {
      check: async function () {
        if (!('serviceWorker' in navigator)) return false;
        try {
          const registration =
              await navigator.serviceWorker.getRegistration();
          if (!registration) return false;
          await registration.update();
          return !!registration.waiting;
        } catch (_) {
          return false;
        }
      },
      apply: async function () {
        if (!('serviceWorker' in navigator)) {
          location.reload();
          return;
        }
        try {
          const registrations =
              await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(r => r.unregister()));
        } finally {
          location.reload();
        }
      }
    };

    window.repertorioNotifications = {
      permission: function () {
        if (!('Notification' in window)) return 'unsupported';
        return Notification.permission;
      },
      requestPermission: async function () {
        if (!('Notification' in window)) return 'unsupported';
        return await Notification.requestPermission();
      },
      show: function (title, body) {
        if (!('Notification' in window) || Notification.permission !== 'granted') {
          return;
        }
        new Notification(title, {
          body: body,
          icon: 'icons/Icon.svg',
          badge: 'icons/Icon-maskable.svg',
          tag: 'repertorio-study-reminder'
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
