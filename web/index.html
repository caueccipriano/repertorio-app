<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Repertório — sua biblioteca pessoal de conhecimento."
  >
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#F5F2EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Repertório">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/Icon.svg">
  <link rel="manifest" href="manifest.json">

  <title>Repertório</title>
</head>
<body>
  <script>
    window.repertorioSpeech = {
      supported: function () {
        return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
      },
      speak: function (text, rate) {
        return new Promise(function (resolve) {
          if (!window.repertorioSpeech.supported()) {
            resolve('unsupported');
            return;
          }
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';
          utterance.rate = Math.max(0.7, Math.min(1.5, rate || 1.0));
          utterance.pitch = 1.0;
          utterance.onend = function () { resolve('ended'); };
          utterance.onerror = function () { resolve('error'); };
          window.speechSynthesis.speak(utterance);
        });
      },
      stop: function () {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    };

    window.repertorioNotifications = {
      permission: function () {
        if (!('Notification' in window)) return 'unsupported';
        return Notification.permission;
      },
      requestPermission: async function () {
        if (!('Notification' in window)) return 'unsupported';
        return await Notification.requestPermission();
      },
      show: function (title, body) {
        if (!('Notification' in window) || Notification.permission !== 'granted') {
          return;
        }
        new Notification(title, {
          body: body,
          icon: 'icons/Icon.svg',
          badge: 'icons/Icon-maskable.svg',
          tag: 'repertorio-study-reminder'
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
