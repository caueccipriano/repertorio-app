<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Repertório — sua biblioteca pessoal de conhecimento."
  >
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#F5F2EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Repertório">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/Icon.svg">
  <link rel="manifest" href="manifest.json">

  <title>Repertório</title>
</head>
<body>
  <script>
    window.repertorioSpeech = {
      supported: function () {
        return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
      },
      speak: function (text, rate) {
        return new Promise(function (resolve) {
          if (!window.repertorioSpeech.supported()) {
            resolve('unsupported');
            return;
          }
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';
          utterance.rate = Math.max(0.7, Math.min(1.5, rate || 1.0));
          utterance.pitch = 1.0;
          utterance.onend = function () { resolve('ended'); };
          utterance.onerror = function () { resolve('error'); };
          window.speechSynthesis.speak(utterance);
        });
      },
      stop: function () {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    };

    window.repertorioOffline = {
      supported: function () {
        return 'caches' in window;
      },
      cacheUrl: async function (url) {
        try {
          const cache = await caches.open('repertorio-media-v1');
          const response = await fetch(url, { mode: 'no-cors' });
          await cache.put(url, response.clone());
          return true;
        } catch (_) {
          return false;
        }
      },
      removeUrl: async function (url) {
        try {
          const cache = await caches.open('repertorio-media-v1');
          return await cache.delete(url);
        } catch (_) {
          return false;
        }
      }
    };

    window.repertorioShareCard = {
      supported: function () {
        return 'HTMLCanvasElement' in window;
      },
      share: async function (title, body) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1350;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#F5F2EA';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#173B91';
          ctx.beginPath();
          ctx.arc(170, 190, 90, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#101010';
          ctx.fillRect(300, 90, 46, 260);

          ctx.font = '700 38px Arial';
          ctx.fillStyle = '#173B91';
          ctx.fillText('repertório*', 90, 460);

          function wrapText(text, x, y, maxWidth, lineHeight, maxLines) {
            const words = text.split(/\s+/);
            let line = '';
            let lines = 0;
            for (let n = 0; n < words.length; n++) {
              const testLine = line + words[n] + ' ';
              const metrics = ctx.measureText(testLine);
              if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line.trim(), x, y);
                line = words[n] + ' ';
                y += lineHeight;
                lines++;
                if (lines >= maxLines - 1) break;
              } else {
                line = testLine;
              }
            }
            if (lines < maxLines) ctx.fillText(line.trim(), x, y);
            return y;
          }

          ctx.fillStyle = '#101010';
          ctx.font = '700 68px Georgia';
          const titleEnd = wrapText(title, 90, 570, 900, 78, 4);

          ctx.fillStyle = '#575752';
          ctx.font = '400 34px Arial';
          wrapText(body, 90, titleEnd + 90, 900, 52, 8);

          ctx.fillStyle = '#173B91';
          ctx.font = '700 24px Arial';
          ctx.fillText('aprendi hoje no Repertório', 90, 1260);

          const blob = await new Promise(resolve =>
            canvas.toBlob(resolve, 'image/png')
          );
          if (!blob) return false;

          const file = new File([blob], 'repertorio-card.png', {
            type: 'image/png'
          });

          if (navigator.share && navigator.canShare &&
              navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Repertório',
              text: title
            });
            return true;
          }

          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = 'repertorio-card.png';
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          return true;
        } catch (_) {
          return false;
        }
      }
    };

    window.repertorioUpdates = {
      check: async function () {
        if (!('serviceWorker' in navigator)) return false;
        try {
          const registration =
              await navigator.serviceWorker.getRegistration();
          if (!registration) return false;
          await registration.update();
          return !!registration.waiting;
        } catch (_) {
          return false;
        }
      },
      apply: async function () {
        if (!('serviceWorker' in navigator)) {
          location.reload();
          return;
        }
        try {
          const registrations =
              await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(r => r.unregister()));
        } finally {
          location.reload();
        }
      }
    };

    window.repertorioNotifications = {
      permission: function () {
        if (!('Notification' in window)) return 'unsupported';
        return Notification.permission;
      },
      requestPermission: async function () {
        if (!('Notification' in window)) return 'unsupported';
        return await Notification.requestPermission();
      },
      show: function (title, body) {
        if (!('Notification' in window) || Notification.permission !== 'granted') {
          return;
        }
        new Notification(title, {
          body: body,
          icon: 'icons/Icon.svg',
          badge: 'icons/Icon-maskable.svg',
          tag: 'repertorio-study-reminder'
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
