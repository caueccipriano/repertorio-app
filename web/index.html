<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Repertório — sua biblioteca pessoal de conhecimento.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">

  <meta name="theme-color" content="#F5F2EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Repertório">

  <link rel="icon" type="image/svg+xml" href="icons/Icon-v3.svg?v=9">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-v3.svg?v=9">
  <link rel="manifest" href="manifest.json?v=9">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F5F2EA;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: fixed;
      inset: 0;
    }

    body {
      -webkit-user-select: none;
      user-select: none;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-semantics-host,
    #flt-glass-pane {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      transform: translateZ(0);
      transform-origin: top left;
    }
  </style>

  <title>Repertório</title>
</head>
<body>
  <script>
    (function () {
      function isHttpUrl(value) {
        return /^https?:\/\//i.test(String(value || '')) || /^spotify:/i.test(String(value || ''));
      }

      function toSpotifyEmbedUrl(value) {
        try {
          const raw = String(value || '').trim();
          if (!raw) return null;

          if (/^spotify:/i.test(raw)) {
            const parts = raw.split(':');
            if (parts.length >= 3) {
              return 'https://open.spotify.com/embed/' + encodeURIComponent(parts[1]) + '/' + encodeURIComponent(parts[2]) + '?utm_source=generator&theme=0';
            }
            return null;
          }

          const url = new URL(raw);
          const pathParts = url.pathname.split('/').filter(Boolean);
          const embeddable = ['episode', 'show', 'track', 'album', 'playlist'];
          const type = pathParts.find(part => embeddable.includes(part));
          if (type) {
            const index = pathParts.indexOf(type);
            const id = pathParts[index + 1];
            if (id) {
              return 'https://open.spotify.com/embed/' + type + '/' + encodeURIComponent(id) + '?utm_source=generator&theme=0';
            }
          }

          if (url.hostname.includes('spotify.com') && pathParts[0] === 'search') {
            return raw;
          }

          return raw;
        } catch (_) {
          return null;
        }
      }

      function forceViewportSync() {
        try {
          document.documentElement.style.width = '100vw';
          document.documentElement.style.height = '100dvh';
          document.body.style.width = '100vw';
          document.body.style.height = '100dvh';
          window.scrollTo(0, 0);
        } catch (_) {}
      }

      function removeAudioPopup() {
        try {
          const previous = document.getElementById('repertorio-audio-popup');
          if (previous) previous.remove();
        } catch (_) {}
      }

      function showAudioPopup(url, title, source) {
        removeAudioPopup();

        const embedUrl = toSpotifyEmbedUrl(url);
        if (!embedUrl || !isHttpUrl(embedUrl)) return false;

        const overlay = document.createElement('div');
        overlay.id = 'repertorio-audio-popup';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'false');
        overlay.setAttribute('aria-label', 'Player de áudio');
        overlay.style.position = 'fixed';
        overlay.style.inset = '0';
        overlay.style.zIndex = '2147483647';
        overlay.style.pointerEvents = 'none';
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'flex-start';
        overlay.style.justifyContent = 'center';
        overlay.style.padding = 'calc(env(safe-area-inset-top) + 68px) 12px 12px';
        overlay.style.boxSizing = 'border-box';
        overlay.style.transition = 'padding .18s ease, align-items .18s ease';

        const shell = document.createElement('div');
        shell.style.width = 'min(100%, 430px)';
        shell.style.maxHeight = 'calc(100dvh - env(safe-area-inset-top) - 96px)';
        shell.style.background = '#121212';
        shell.style.border = '1px solid rgba(255,255,255,.18)';
        shell.style.borderRadius = '18px';
        shell.style.overflow = 'hidden';
        shell.style.boxShadow = '0 18px 48px rgba(0,0,0,.38)';
        shell.style.pointerEvents = 'auto';
        shell.style.fontFamily = 'Arial, sans-serif';
        shell.style.transition = 'width .18s ease, border-radius .18s ease, transform .18s ease';

        const header = document.createElement('div');
        header.style.minHeight = '48px';
        header.style.display = 'flex';
        header.style.alignItems = 'center';
        header.style.gap = '8px';
        header.style.padding = '8px 8px 8px 14px';
        header.style.background = '#10265E';
        header.style.color = '#fff';

        const textWrap = document.createElement('div');
        textWrap.style.flex = '1';
        textWrap.style.minWidth = '0';

        const label = document.createElement('div');
        label.textContent = source || 'Spotify';
        label.style.fontSize = '10px';
        label.style.fontWeight = '800';
        label.style.letterSpacing = '.08em';
        label.style.textTransform = 'uppercase';
        label.style.opacity = '.72';
        label.style.marginBottom = '2px';

        const titleEl = document.createElement('div');
        titleEl.textContent = title || 'Áudio';
        titleEl.style.fontSize = '13px';
        titleEl.style.fontWeight = '800';
        titleEl.style.whiteSpace = 'nowrap';
        titleEl.style.overflow = 'hidden';
        titleEl.style.textOverflow = 'ellipsis';

        function makeHeaderButton(labelText, ariaLabel) {
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-label', ariaLabel);
          button.textContent = labelText;
          button.style.border = '0';
          button.style.background = 'rgba(255,255,255,.10)';
          button.style.color = '#fff';
          button.style.fontSize = '22px';
          button.style.fontWeight = '800';
          button.style.lineHeight = '1';
          button.style.width = '40px';
          button.style.height = '40px';
          button.style.borderRadius = '999px';
          button.style.cursor = 'pointer';
          button.style.display = 'grid';
          button.style.placeItems = 'center';
          return button;
        }

        const minimize = makeHeaderButton('−', 'Minimizar player');
        const close = makeHeaderButton('×', 'Fechar player');
        close.style.fontSize = '28px';
        close.style.background = 'transparent';

        const frameWrap = document.createElement('div');
        frameWrap.style.background = '#121212';
        frameWrap.style.padding = '10px';
        frameWrap.style.overflow = 'hidden';
        frameWrap.style.transition = 'height .18s ease, padding .18s ease, opacity .18s ease';

        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.title = title || 'Spotify player';
        iframe.loading = 'eager';
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.style.display = 'block';
        iframe.style.width = '100%';
        iframe.style.height = embedUrl.includes('/embed/') ? '232px' : '360px';
        iframe.style.border = '0';
        iframe.style.borderRadius = '12px';
        iframe.style.background = '#121212';

        const hint = document.createElement('div');
        hint.textContent = embedUrl.includes('/embed/')
          ? 'toque no play dentro do card'
          : 'escolha um episódio dentro do Spotify';
        hint.style.color = '#b8b8b8';
        hint.style.font = '700 11px/1.35 Arial, sans-serif';
        hint.style.marginTop = '8px';
        hint.style.textAlign = 'center';

        let minimized = false;
        function applyMinimizedState() {
          if (minimized) {
            overlay.style.alignItems = 'flex-end';
            overlay.style.padding = '12px 12px calc(env(safe-area-inset-bottom) + 14px)';
            shell.style.width = 'min(calc(100% - 8px), 360px)';
            shell.style.borderRadius = '999px';
            shell.style.transform = 'translateZ(0)';
            header.style.minHeight = '50px';
            header.style.padding = '6px 8px 6px 14px';
            label.textContent = 'TOCANDO';
            titleEl.textContent = title || 'Spotify';
            frameWrap.style.height = '0';
            frameWrap.style.padding = '0 10px';
            frameWrap.style.opacity = '0';
            frameWrap.style.pointerEvents = 'none';
            minimize.textContent = '▢';
            minimize.setAttribute('aria-label', 'Restaurar player');
          } else {
            overlay.style.alignItems = 'flex-start';
            overlay.style.padding = 'calc(env(safe-area-inset-top) + 68px) 12px 12px';
            shell.style.width = 'min(100%, 430px)';
            shell.style.borderRadius = '18px';
            header.style.minHeight = '48px';
            header.style.padding = '8px 8px 8px 14px';
            label.textContent = source || 'Spotify';
            titleEl.textContent = title || 'Áudio';
            frameWrap.style.height = 'auto';
            frameWrap.style.padding = '10px';
            frameWrap.style.opacity = '1';
            frameWrap.style.pointerEvents = 'auto';
            minimize.textContent = '−';
            minimize.setAttribute('aria-label', 'Minimizar player');
          }
        }

        textWrap.appendChild(label);
        textWrap.appendChild(titleEl);
        header.appendChild(textWrap);
        header.appendChild(minimize);
        header.appendChild(close);
        frameWrap.appendChild(iframe);
        frameWrap.appendChild(hint);
        shell.appendChild(header);
        shell.appendChild(frameWrap);
        overlay.appendChild(shell);
        document.body.appendChild(overlay);

        minimize.addEventListener('click', function () {
          minimized = !minimized;
          applyMinimizedState();
        });

        header.addEventListener('click', function (event) {
          if (event.target === minimize || event.target === close) return;
          if (minimized) {
            minimized = false;
            applyMinimizedState();
          }
        });

        close.addEventListener('click', function () {
          removeAudioPopup();
        });

        window.setTimeout(function () {
          try { close.focus(); } catch (_) {}
        }, 40);

        return true;
      }

      window.addEventListener('resize', forceViewportSync, { passive: true });
      window.addEventListener('orientationchange', function () {
        window.setTimeout(forceViewportSync, 80);
        window.setTimeout(forceViewportSync, 350);
      }, { passive: true });
      window.addEventListener('focus', forceViewportSync, { passive: true });
      document.addEventListener('visibilitychange', forceViewportSync, { passive: true });
      forceViewportSync();

      window.repertorioAudio = {
        open: function (url, title, source) {
          try {
            const target = String(url || '').trim();
            if (!isHttpUrl(target)) return false;
            return showAudioPopup(target, title, source);
          } catch (_) {
            return false;
          }
        }
      };

      window.repertorioSpeech = {
        generation: 0,
        supported: function () {
          return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
        },
        speak: function (text, rate) {
          return new Promise(function (resolve) {
            if (!window.repertorioSpeech.supported()) {
              resolve(false);
              return;
            }

            const synth = window.speechSynthesis;
            const generation = ++window.repertorioSpeech.generation;
            const cleanText = String(text || '').replace(/\s+/g, ' ').trim();
            if (!cleanText) {
              resolve(false);
              return;
            }

            const sentences = cleanText.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [cleanText];
            const chunks = [];
            let current = '';
            sentences.forEach(function (sentence) {
              const next = (current + ' ' + sentence).trim();
              if (next.length > 220 && current) {
                chunks.push(current);
                current = sentence.trim();
              } else {
                current = next;
              }
            });
            if (current) chunks.push(current);

            const chooseVoice = function () {
              const voices = synth.getVoices ? synth.getVoices() : [];
              return voices.find(v => /^pt-BR$/i.test(v.lang)) || voices.find(v => /^pt/i.test(v.lang)) || null;
            };

            let index = 0;
            let resolved = false;
            const finish = function (value) {
              if (!resolved) {
                resolved = true;
                resolve(value);
              }
            };

            const speakNext = function () {
              if (generation !== window.repertorioSpeech.generation) return;
              if (index >= chunks.length) return;

              const utterance = new SpeechSynthesisUtterance(chunks[index++]);
              utterance.lang = 'pt-BR';
              utterance.rate = Math.max(0.7, Math.min(1.5, rate || 1.0));
              utterance.pitch = 1.0;
              utterance.volume = 1.0;
              const voice = chooseVoice();
              if (voice) utterance.voice = voice;
              utterance.onstart = function () { finish(true); };
              utterance.onend = function () {
                if (generation === window.repertorioSpeech.generation) speakNext();
              };
              utterance.onerror = function () { finish(false); };
              synth.speak(utterance);
              if (synth.paused) synth.resume();
              finish(true);
            };

            if (synth.speaking || synth.pending || synth.paused) synth.cancel();
            if (synth.getVoices) synth.getVoices();
            speakNext();
          });
        },
        stop: function () {
          if ('speechSynthesis' in window) {
            window.repertorioSpeech.generation++;
            window.speechSynthesis.cancel();
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          }
        }
      };

      if ('speechSynthesis' in window && window.speechSynthesis.getVoices) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.addEventListener?.('voiceschanged', function () {
          window.speechSynthesis.getVoices();
        });
      }

      window.repertorioSpotify = {
        open: function (url) {
          return showAudioPopup(url, 'Spotify', 'Spotify');
        }
      };

      window.repertorioOffline = {
        supported: function () { return 'caches' in window; },
        cacheUrl: async function (url) {
          try {
            const cache = await caches.open('repertorio-media-v2');
            const response = await fetch(url, { mode: 'no-cors' });
            await cache.put(url, response.clone());
            return true;
          } catch (_) { return false; }
        },
        removeUrl: async function (url) {
          try {
            const cache = await caches.open('repertorio-media-v2');
            return await cache.delete(url);
          } catch (_) { return false; }
        }
      };

      window.repertorioShareCard = {
        supported: function () { return 'HTMLCanvasElement' in window; },
        share: async function (title, body) {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1350;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#F5F2EA';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#173B91';
            ctx.beginPath();
            ctx.arc(170, 190, 90, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#101010';
            ctx.font = '700 38px Arial';
            ctx.fillText('repertório*', 90, 460);
            ctx.font = '700 68px Georgia';
            ctx.fillText(String(title || 'Repertório').slice(0, 42), 90, 570);
            ctx.fillStyle = '#575752';
            ctx.font = '400 34px Arial';
            ctx.fillText(String(body || 'aprendi hoje').slice(0, 54), 90, 660);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (!blob) return false;
            const file = new File([blob], 'repertorio-card.png', { type: 'image/png' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: 'Repertório', text: title });
              return true;
            }
            const objectUrl = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = objectUrl;
            anchor.download = 'repertorio-card.png';
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            return true;
          } catch (_) { return false; }
        }
      };

      window.repertorioUpdates = {
        check: async function () {
          if (!('serviceWorker' in navigator)) return false;
          try {
            const registration = await navigator.serviceWorker.getRegistration();
            if (!registration) return false;
            await registration.update();
            return !!registration.waiting;
          } catch (_) { return false; }
        },
        apply: async function () {
          if (!('serviceWorker' in navigator)) {
            location.reload();
            return;
          }
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(r => r.unregister()));
          } finally {
            location.reload();
          }
        }
      };

      window.repertorioNotifications = {
        permission: function () {
          if (!('Notification' in window)) return 'unsupported';
          return Notification.permission;
        },
        requestPermission: async function () {
          if (!('Notification' in window)) return 'unsupported';
          return await Notification.requestPermission();
        },
        show: function (title, body) {
          if (!('Notification' in window) || Notification.permission !== 'granted') return;
          new Notification(title, {
            body: body,
            icon: 'icons/Icon-v3.svg',
            badge: 'icons/Icon-v3.svg',
            tag: 'repertorio-study-reminder'
          });
        }
      };
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20260918-pwa-spotify-popup-minimize-1" async></script>
</body>
</html>
