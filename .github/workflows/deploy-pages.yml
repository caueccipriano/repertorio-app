name: Deploy Repertório Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Sanitize generated topic media syntax
        run: |
          perl -0pi -e 's/\n,media:/\n media:/g' lib/features/today/data/demo_topics.dart
          perl -0pi -e 's/\n  Future<void> _openAudio\(KnowledgeMedia media\) async \{.*?\n  \}\n\n  void _goBack/\n  void _goBack/s' lib/features/article/presentation/article_screen.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/repertorio-app/"

      - name: Generate iOS/PWA PNG icons
        run: |
          python3 - <<'PY'
          import base64, re, pathlib
          svg = pathlib.Path('web/icons/Icon-v3.svg').read_text()
          m = re.search(r'base64,([^"]+)', svg)
          if not m:
              raise SystemExit('Embedded PNG not found in Icon-v3.svg')
          raw = base64.b64decode(m.group(1))
          out = pathlib.Path('build/web/icons')
          out.mkdir(parents=True, exist_ok=True)
          for name in ('apple-touch-icon-v3.png', 'Icon-192-v3.png', 'Icon-512-v3.png', 'Icon-maskable-512-v3.png'):
              (out / name).write_bytes(raw)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
