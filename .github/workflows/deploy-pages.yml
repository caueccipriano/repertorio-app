name: Deploy Repertório Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Audit editorial catalog
        run: dart run tool/editorial_audit.dart --strict

      - name: Test
        run: flutter test

      - name: Test PWA update flow
        run: node --test test/web_update.test.mjs

      - name: Stamp web release identity
        run: |
          sed -i "s/__APP_BUILD_ID__/${GITHUB_SHA}/g" web/index.html
          printf '{"version":"%s"}\n' "${GITHUB_SHA}" > web/version.json

      - name: Build web
        run: flutter build web --release --base-href "/repertorio-app/"

      - name: Validate release identity and published app icon
        run: |
          grep -Fq "${GITHUB_SHA}" build/web/index.html
          grep -Fq "${GITHUB_SHA}" build/web/version.json
          python3 - <<'PY'
          import pathlib, struct
          p = pathlib.Path('build/web/app-icon-v6.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'app icon is not a valid PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (180, 180), f'unexpected PNG dimensions: {width}x{height}'
          print(f'Validated PNG: {width}x{height}, {len(data)} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
