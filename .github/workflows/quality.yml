name: Quality

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Sanitize generated topic media syntax
        run: perl -0pi -e 's/\n,media:/\n media:/g' lib/features/today/data/demo_topics.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
