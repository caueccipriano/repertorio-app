name: Quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Audit editorial catalog
        run: dart run tool/editorial_audit.dart --strict

      - name: Test
        run: flutter test

      - name: Test PWA update flow
        run: node --test test/web_update.test.mjs

      - name: Stamp web release identity
        run: |
          sed -i "s/__APP_BUILD_ID__/${GITHUB_SHA}/g" web/index.html
          printf '{"version":"%s"}\n' "${GITHUB_SHA}" > web/version.json

      - name: Build web for release parity
        run: flutter build web --release --base-href "/repertorio-app/"

      - name: Check generated web bundle
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/app-icon-v6.png
          grep -Fq "${GITHUB_SHA}" build/web/index.html
          grep -Fq "${GITHUB_SHA}" build/web/version.json
